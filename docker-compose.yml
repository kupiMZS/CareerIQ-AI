services:

  mysql:
    image: mysql:8.0
    container_name: careeriq-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - careeriq-network


  redis:
    image: redis:7-alpine
    container_name: careeriq-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - careeriq-network


  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile

    container_name: careeriq-backend
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      AI_ENGINE_URL: http://ai-engine:8000

    networks:
      - careeriq-network


  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile

    container_name: careeriq-ai-engine
    restart: unless-stopped

    ports:
      - "8001:8000"

    environment:
      AI_PROVIDER: "${AI_PROVIDER:-rule_based}"
      AI_MODEL: "${AI_MODEL:-rule-based-v1}"
      AI_BASE_URL: "${AI_BASE_URL:-http://host.docker.internal:11434}"
      AI_REQUEST_PATH: "${AI_REQUEST_PATH:-/api/chat}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-60}"
      AI_MAX_RETRIES: "${AI_MAX_RETRIES:-2}"
      AI_RETRY_BACKOFF_SECONDS: "${AI_RETRY_BACKOFF_SECONDS:-0.5}"
      AI_FALLBACK_ENABLED: "${AI_FALLBACK_ENABLED:-true}"
      AI_FALLBACK_PROVIDER: "${AI_FALLBACK_PROVIDER:-rule_based}"

    networks:
      - careeriq-network

    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:

  mysql_data:


networks:

  careeriq-network:
    driver: bridge