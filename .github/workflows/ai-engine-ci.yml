name: AI Engine CI

on:
  push:
    branches: [main]
    paths:
      - "ai-engine/**"
      - ".github/workflows/ai-engine-ci.yml"
  pull_request:
    paths:
      - "ai-engine/**"
      - ".github/workflows/ai-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect AI engine application
        id: ai_engine
        shell: bash
        run: |
          if [[ -s ai-engine/requirements.txt && -s ai-engine/app/main.py ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "AI engine is not implemented yet; CI checks are deferred."
          fi

      - name: Set up Python
        if: steps.ai_engine.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install dependencies
        if: steps.ai_engine.outputs.ready == 'true'
        run: pip install -r ai-engine/requirements.txt

      - name: Compile Python sources
        if: steps.ai_engine.outputs.ready == 'true'
        run: python -m compileall -q ai-engine/app

      - name: Run tests
        if: steps.ai_engine.outputs.ready == 'true'
        working-directory: ai-engine
        run: |
          if [[ -d tests ]]; then
            python -m pytest
          else
            echo "No AI engine tests exist yet."
          fi
